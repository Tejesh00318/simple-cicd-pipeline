name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4.2.2  # Updated version

    - name: Set up Python
      uses: actions/setup-python@v5.4.0  # Updated version
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Tests
      run: |
        pytest test_app.py

    - name: Log in to Docker Hub
      uses: docker/login-action@v3.3.0  # Updated version
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v6.13.0  # Updated version
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/simple-web-app:latest

